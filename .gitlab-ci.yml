image: alpine:latest  # Image légère avec SSH

stages:
  - deploy

variables:
  DEPLOY_PATH: "/home/sites/25a/3/3af37bad2e/public_html"
  SERVER_USER: "sgrosrey.fr"
  SERVER_IP: "ssh.gb.stackcp.com"

deploy_production:
  stage: deploy
  only:
    - dev
  before_script:
    - apk update && apk add openssh-client  # Utilisation d'apk au lieu d'apt-get
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        cd $DEPLOY_PATH &&
        git pull origin dev &&
        composer install --no-dev --optimize-autoloader &&
        php bin/console cache:clear --env=prod
      "
